<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Student Safety</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            font-size: 48px;
        }

        .logo h1 {
            color: #0f172a;
            margin-top: 8px;
            font-size: 25px;
        }

        .logo p {
            color: #64748b;
            margin-top: 6px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 22px;
            color: #0f172a;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .security {
            margin-top: 18px;
            padding: 12px;
            background: #eff6ff;
            color: #1e40af;
            border-radius: 9px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">

        <div class="logo-icon">
            🛡️
        </div>

        <h1>
            Smart Student Safety
        </h1>

        <p>
            Emergency Alert & Safety System
        </p>

    </div>


    <div class="card">

        <h2>
            🔐 Student Login
        </h2>

        <form method="POST" action="/login">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>


        <div class="security">
            🔒 Your account and safety information are protected.
        </div>

    </div>

</div>

</body>
</html>
